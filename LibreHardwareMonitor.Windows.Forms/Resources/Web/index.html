<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <title>Libre Hardware Monitor</title>
    <script>
        // Aplica o tema guardado antes da primeira pintura (evita flash). Temas da app: light | dark | black.
        try {
            const saved = localStorage.getItem("color-scheme");
            if (saved === "light" || saved === "dark" || saved === "black") {
                document.documentElement.dataset.theme = saved;
                document.documentElement.style.colorScheme = saved === "light" ? "light" : "dark";
            }
        } catch (_) {}
    </script>
    <style>
        /* Mesmos tons dos temas da app (Fluent / Windows 11) */
        :root {
            color-scheme: light dark;
            --bg:          light-dark(#f3f3f3, #202020);
            --surface:     light-dark(#ffffff, #2b2b2b);
            --surface-alt: light-dark(#fafafa, #2f2f2f);
            --stroke:      light-dark(#e5e5e5, #3a3a3a);
            --line:        light-dark(#f0f0f0, #333333);
            --hover:       light-dark(#f2f2f2, #363636);
            --text:        light-dark(#1b1b1b, #f0f0f0);
            --muted:       light-dark(#616161, #a8a8a8);
            /* Acento por defeito da app; no escuro a app mistura-o com 45% de branco (FluentStyle.AccentFor) */
            --accent:      light-dark(#0067c0, #73abdc);
            --on-accent:   light-dark(#ffffff, #000000);
            --ctrl:        light-dark(#fbfbfb, #2d2d2d);
            --ctrl-hover:  light-dark(#f5f5f5, #333333);
            --ctrl-bottom: light-dark(#cfcfcf, #464646);
            --track:       light-dark(#e3e3e3, #444444);
            /* Cores de sistema do Fluent */
            --ok:   light-dark(#0f7b0f, #6ccb5f);
            --warn: light-dark(#9d5d00, #fce100);
            --crit: light-dark(#c42b1c, #ff99a4);

            --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
            --row: 24px;
            --cv: 9.5ch;   /* coluna Valor */
            --cm: 8.5ch;   /* colunas Min/Max */
            scrollbar-color: var(--track) transparent;
            scrollbar-width: thin;
        }

        /* Tema Preto (OLED) da app: BlackTheme.cs */
        :root[data-theme="black"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0e0e0e; --surface-alt: #121212; --stroke: #242424; --line: #181818;
            --hover: #1e1e1e; --text: #e4e4e4; --muted: #9c9c9c; --accent: #73abdc; --on-accent: #000000;
            --ctrl: #0e0e0e; --ctrl-hover: #1a1a1a; --ctrl-bottom: #333333; --track: #2a2a2a;
            --ok: #5ee36a; --warn: #ffd43b; --crit: #ff6b7a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font); font-size: 13px; line-height: 1.35;
            background: var(--bg); color: var(--text);
            min-height: 100dvh; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
        }
        button, select, input { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        svg.i { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
        .spacer { flex: 1; }
        [hidden] { display: none !important; }

        /* ---------- Barra de comandos ---------- */
        .cmdbar {
            position: sticky; top: 0; z-index: 10;
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
            padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--stroke);
        }
        .brand { display: flex; align-items: center; gap: 8px; min-width: 0; margin-right: 8px; }
        .brand img { width: 18px; height: 18px; flex: none; }
        .brand b { font-weight: 600; font-size: 14px; white-space: nowrap; }
        .brand span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .ctl {
            height: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px;
            background: var(--ctrl); border: 1px solid var(--stroke); border-bottom-color: var(--ctrl-bottom); border-radius: 4px;
            cursor: pointer; white-space: nowrap; user-select: none;
        }
        .ctl:hover { background: var(--ctrl-hover); }
        .ctl svg { width: 15px; height: 15px; flex: none; }
        .ctl.icon { width: 30px; padding: 0; }
        select.ctl { padding: 0 4px 0 8px; }

        .search { position: relative; width: 240px; }
        .search svg { position: absolute; left: 9px; top: 50%; translate: 0 -50%; width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
        .search input { width: 100%; height: 30px; padding: 0 8px 0 28px; border-radius: 4px; outline: none;
            background: var(--ctrl); border: 1px solid var(--stroke); border-bottom-color: var(--muted); }
        .search input::placeholder { color: var(--muted); }
        .search input:focus { background: var(--surface); border-bottom: 2px solid var(--accent); }

        .seg { display: inline-flex; height: 30px; border: 1px solid var(--stroke); border-bottom-color: var(--ctrl-bottom); border-radius: 4px; overflow: hidden; background: var(--ctrl); }
        .seg button { border: 0; background: transparent; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .seg button + button { border-left: 1px solid var(--stroke); }
        .seg button svg { width: 14px; height: 14px; }
        .seg button:hover { background: var(--ctrl-hover); }
        .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

        main { flex: 1; padding: 12px 16px 16px; }

        /* ---------- Faixa de resumo ---------- */
        .summary { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-bottom: 12px; }
        .stat {
            display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 10px;
            padding: 8px 12px; background: var(--surface); border: 1px solid var(--stroke); border-radius: 8px; min-width: 0;
        }
        .stat img { width: 20px; height: 20px; }
        .stat-id { min-width: 0; }
        .stat-id small { display: block; color: var(--muted); font-size: 11px; line-height: 1.2; }
        .stat-id span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat-vals { display: flex; gap: 12px; align-items: baseline; }
        .stat-vals b { font-size: 16px; font-weight: 600; white-space: nowrap; }
        .stat-vals b + b { color: var(--muted); font-weight: 500; font-size: 14px; }
        .stat .spark { grid-column: 1 / -1; width: 100%; height: 22px; margin-top: 6px; display: block; }
        .spark .line { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
        .spark .area { fill: var(--accent); opacity: .12; }

        [data-lv="warn"] { color: var(--warn) !important; }
        [data-lv="crit"] { color: var(--crit) !important; }

        /* ---------- Paineis (masonry por colunas, calculado em JS) ---------- */
        .panels { display: flex; gap: 8px; align-items: flex-start; }
        .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
        .panel {
            container-type: inline-size;
            background: var(--surface); border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden;
        }
        .p-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--surface-alt); border-bottom: 1px solid var(--stroke); }
        .p-head img { width: 16px; height: 16px; flex: none; }
        .p-title { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 6px; }
        .p-title b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-title small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Grelha comum: Sensor | Valor | Min | Max */
        .grid4 { display: grid; grid-template-columns: minmax(0, 1fr) 48px var(--cv) var(--cm) var(--cm); column-gap: 8px; align-items: center; }
        .grid4 > :not(:first-child) { text-align: right; white-space: nowrap; }
        .colhead { padding: 3px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); }

        details { border-bottom: 1px solid var(--line); }
        details:last-child { border-bottom: 0; }
        summary { height: var(--row); padding: 0 10px; cursor: pointer; list-style: none; user-select: none; display: flex; align-items: center; gap: 8px; }
        summary .cat-name { flex: 1; }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: var(--hover); }
        .cat-name { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
        .cat-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cat-name em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 11px; }
        .cat-name img { width: 14px; height: 14px; flex: none; }
        .chev { width: 10px; height: 10px; flex: none; color: var(--muted); transition: rotate .1s; }
        details[open] .chev { rotate: 90deg; }
        .cat-sum { color: var(--muted); font-size: 12px; }
        details[open] .cat-sum { visibility: hidden; }

        .row { height: var(--row); padding: 0 10px 0 30px; }
        .row:hover { background: var(--hover); }
        .row .name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Medidor fino na sua propria coluna (percentagem / temperatura) */
        .meter { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
        .meter i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--accent); transition: width .25s; }
        .meter i[data-lv="warn"] { background: var(--warn); }
        .meter i[data-lv="crit"] { background: var(--crit); }
        .row .v { font-weight: 600; }
        .row .mn, .row .mx { color: var(--muted); font-size: 12px; }

        /* Paineis estreitos: so o valor */
        @container (max-width: 370px) {
            .grid4 { grid-template-columns: minmax(0, 1fr) 40px var(--cv); }
            .grid4 > :nth-child(n+4) { display: none; }
        }

        .empty { padding: 48px 0; text-align: center; color: var(--muted); }

        /* ---------- Vista em arvore (como a app) ---------- */
        .tree { background: var(--surface); border: 1px solid var(--stroke); border-radius: 8px; overflow: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background: var(--surface-alt); text-align: left; font-weight: 400; color: var(--muted); font-size: 12px; padding: 6px 12px; border-bottom: 1px solid var(--stroke); }
        th.n, td.n { text-align: right; width: 12%; white-space: nowrap; }
        td { height: var(--row); padding: 0 12px; border-bottom: 1px solid var(--line); }
        td.v { font-weight: 600; }
        td.muted { color: var(--muted); }
        tr.hw td { font-weight: 600; background: var(--surface-alt); }
        tr.cat td { font-weight: 600; padding-left: 32px; }
        tr.s td:first-child { padding-left: 54px; }
        tr.s:hover td, tr.cat:hover td { background: var(--hover); }
        .t-name { display: flex; align-items: center; gap: 6px; }
        .t-name img { width: 16px; height: 16px; }
        tr.cat .t-name img { width: 14px; height: 14px; }

        /* ---------- Barra de estado (como a app) ---------- */
        .statusbar {
            position: sticky; bottom: 0; z-index: 10;
            display: flex; align-items: center; gap: 8px; padding: 6px 16px;
            background: var(--bg); border-top: 1px solid var(--stroke); color: var(--muted); font-size: 12px;
        }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
        .dot.paused { background: var(--warn); }
        .dot.error { background: var(--crit); }

        @media (max-width: 720px) {
            .cmdbar { padding: 8px 10px; }
            main { padding: 10px; }
            .brand span, .lbl { display: none; }
            .search { order: 10; width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>

<div class="cmdbar">
    <div class="brand">
        <img src="favicon.ico" alt="">
        <b>Libre Hardware Monitor</b>
        <span id="host"></span>
    </div>
    <div class="spacer"></div>
    <label class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="Pesquisar" aria-label="Pesquisar sensor, hardware ou categoria">
    </label>
    <div class="seg" role="group" aria-label="Vista">
        <button id="viewPanels" aria-pressed="true" title="Vista em painéis">
            <svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="10" rx="1.5"/><rect x="14" y="16" width="7" height="5" rx="1.5"/></svg><span class="lbl">Painéis</span>
        </button>
        <button id="viewTree" aria-pressed="false" title="Vista em árvore">
            <svg class="i" viewBox="0 0 24 24"><path d="M4 5h16M8 10h12M8 15h12M4 20h16M4 5v15"/></svg><span class="lbl">Árvore</span>
        </button>
    </div>
    <select class="ctl" id="interval" title="Intervalo de atualização" aria-label="Intervalo de atualização">
        <option value="1000">1 s</option>
        <option value="1500">1,5 s</option>
        <option value="3000">3 s</option>
        <option value="5000">5 s</option>
        <option value="0">Pausar</option>
    </select>
    <button class="ctl" id="reset" title="Repor valores mínimo e máximo">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="lbl">Repor mín/máx</span>
    </button>
    <div class="seg" role="group" aria-label="Tema" id="themes">
        <button data-theme="light" title="Tema claro" aria-label="Tema claro">
            <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        </button>
        <button data-theme="dark" title="Tema escuro" aria-label="Tema escuro">
            <svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button data-theme="black" title="Tema preto (OLED)" aria-label="Tema preto">
            <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>
        </button>
    </div>
</div>

<main>
    <section class="summary" id="summary" aria-label="Resumo"></section>
    <div class="panels" id="panels"></div>
    <p class="empty" id="empty" hidden>Nenhum sensor corresponde à pesquisa.</p>
    <div class="tree" id="tree" hidden>
        <table>
            <thead><tr><th>Sensor</th><th class="n">Valor</th><th class="n">Mínimo</th><th class="n">Máximo</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</main>

<footer class="statusbar" role="status">
    <span class="dot" id="dot"></span><span id="statusText">A ligar...</span>
    <span class="spacer"></span>
    <span id="counts"></span>
</footer>

<script>
(() => {
    "use strict";

    // ---------- Utilitarios ----------
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const store = {
        get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
    };
    const icon = name => "images_icon/" + name;
    const imgName = url => (url || "").split("/").pop();
    const parseNum = str => {
        const m = /(-?\d+(?:[.,]\d+)?)/.exec(str || "");
        return m ? parseFloat(m[1].replace(",", ".")) : null;
    };
    function setText(el, t) { if (el.textContent !== t) el.textContent = t; }
    function setLv(el, lv) { if ((el.dataset.lv || "") !== lv) { if (lv) el.dataset.lv = lv; else delete el.dataset.lv; } }

    // ---------- Estado de um sensor: uma unica escala ----------
    // [aviso, critico] por tipo; as mesmas duas cores em todo o lado.
    const LIMITS = { Temperature: [70, 85], Load: [80, 95] };
    const BAR_TYPES = new Set(["Temperature", "Load", "Control", "Level", "Humidity"]);
    const SUMMARY_TYPES = new Set(["Temperature", "Load", "Clock", "Fan", "Power", "Throughput"]);
    // Categorias abertas por defeito; as restantes (tensoes, dados, fatores...) comecam fechadas.
    const OPEN_TYPES = new Set(["Temperature", "Load", "Clock", "Power", "Fan", "Control", "Throughput", "Level"]);

    const level = s => {
        const lim = LIMITS[s.type];
        if (!lim || s.raw === null) return "";
        return s.raw >= lim[1] ? "crit" : s.raw >= lim[0] ? "warn" : "";
    };
    const barPct = s => (BAR_TYPES.has(s.type) && s.raw !== null ? Math.min(100, Math.max(0, s.raw)) : null);

    // ---------- Leitura do data.json ----------
    function mkSensor(n) {
        const value = n.Value || "-";
        let type = n.Type || "";
        if (!type) type = value.includes("°C") ? "Temperature" : value.includes("%") ? "Load" : "";
        const raw = typeof n.RawValue === "number" ? n.RawValue : parseNum(n.Value);
        return { id: String(n.SensorId || n.id), name: n.Text || "", type, raw, value, min: n.Min || "", max: n.Max || "" };
    }

    function parse(root) {
        const hws = [];
        let host = "";
        (function walk(n, parent) {
            if (n.HardwareId) {
                const hw = { id: n.HardwareId, name: n.Text || "", img: imgName(n.ImageURL), parent, cats: [] };
                hws.push(hw);
                for (const c of n.Children || []) {
                    if (c.HardwareId) walk(c, hw.name);
                    else if (!c.SensorId) {
                        const sensors = (c.Children || []).filter(s => s.SensorId).map(mkSensor);
                        if (sensors.length) hw.cats.push({ key: hw.id + "|" + (c.Text || ""), text: c.Text || "", img: imgName(c.ImageURL), sensors });
                    }
                }
            } else {
                // A raiz ("Sensor") e o no do computador partilham o icone; o mais fundo e o nome da maquina.
                if (imgName(n.ImageURL) === "computer.png" && n.Text) host = n.Text;
                for (const c of n.Children || []) walk(c, parent);
            }
        })(root, "");
        return { hws, host };
    }

    // ---------- Faixa de resumo ----------
    const all = hw => hw.cats.flatMap(c => c.sensors);
    const pick = (hw, type, re) => {
        const list = all(hw).filter(s => s.type === type);
        return (re && list.find(s => re.test(s.name))) || list[0] || null;
    };
    const maxBy = list => list.reduce((a, s) => (s.raw !== null && (!a || s.raw > a.raw) ? s : a), null);

    // Devolve [principal (tambem no sparkline), secundario, nome opcional]
    const TILES = [
        { k: "cpu", label: "Processador", find: hws => hws.find(h => h.img === "cpu.png"),
          build: hw => [pick(hw, "Load", /total/i), pick(hw, "Temperature", /package|tctl|tdie|average|total/i)] },
        { k: "gpu", label: "Placa gráfica", find: hws => hws.find(h => h.img === "nvidia.png" || h.img === "ati.png") || hws.find(h => h.img === "intel.png" || h.img === "amd.png"),
          build: hw => [pick(hw, "Load", /^gpu core$|d3d 3d/i), pick(hw, "Temperature", /gpu core|^gpu/i)] },
        { k: "ram", label: "Memória", find: hws => hws.find(h => h.img === "ram.png"),
          build: hw => [pick(hw, "Load", /^memory$/i), all(hw).find(s => /memory used/i.test(s.name)) || null] },
        { k: "sto", label: "Armazenamento", find: hws => hws.find(h => h.img === "hdd.png"),
          build: (hw, hws) => {
              const drives = hws.filter(h => h.img === "hdd.png");
              const hottest = maxBy(drives.map(d => pick(d, "Temperature")).filter(Boolean));
              const fullest = maxBy(drives.map(d => all(d).find(s => /used space/i.test(s.name))).filter(Boolean));
              return [hottest, fullest, drives.length === 1 ? hw.name : drives.length + " unidades"];
          } }
    ];

    const HISTORY = 60, history = new Map(), tileEls = {};

    function initTiles() {
        $("summary").innerHTML = TILES.map(t => `
            <div class="stat" id="t-${t.k}" hidden>
                <img alt="" width="20" height="20">
                <div class="stat-id"><small>${esc(t.label)}</small><span></span></div>
                <div class="stat-vals"><b>-</b><b></b></div>
                <svg class="spark" viewBox="0 0 120 22" preserveAspectRatio="none" aria-hidden="true"><path class="area"/><path class="line"/></svg>
            </div>`).join("");
        for (const t of TILES) {
            const el = $("t-" + t.k);
            tileEls[t.k] = { el, img: el.querySelector("img"), src: "", name: el.querySelector(".stat-id span"),
                             vals: [...el.querySelectorAll(".stat-vals b")], line: el.querySelector(".line"), area: el.querySelector(".area") };
        }
    }

    function drawSpark(refs, sensor) {
        if (!sensor || sensor.raw === null) { refs.line.removeAttribute("d"); refs.area.removeAttribute("d"); return; }
        const h = history.get(sensor.id) || [];
        h.push(sensor.raw);
        if (h.length > HISTORY) h.shift();
        history.set(sensor.id, h);
        if (h.length < 2) return;
        const pct = sensor.type === "Load";
        let lo = pct ? 0 : Math.min(...h), hi = pct ? 100 : Math.max(...h);
        if (hi - lo < 10) { const mid = (hi + lo) / 2; lo = mid - 5; hi = mid + 5; }
        const off = HISTORY - h.length;
        const pts = h.map((v, i) => [((i + off) / (HISTORY - 1)) * 120, 20 - ((v - lo) / (hi - lo)) * 18]);
        const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
        refs.line.setAttribute("d", d);
        refs.area.setAttribute("d", d + ` L120 22 L${pts[0][0].toFixed(1)} 22 Z`);
    }

    function updateTiles(hws) {
        for (const t of TILES) {
            const r = tileEls[t.k], hw = t.find(hws);
            r.el.hidden = !hw;
            if (!hw) continue;
            const [a, b, name] = t.build(hw, hws);
            if (r.src !== hw.img) { r.src = hw.img; r.img.src = icon(hw.img); }
            setText(r.name, name || hw.name);
            setText(r.vals[0], a ? a.value : "-"); setLv(r.vals[0], a ? level(a) : "");
            setText(r.vals[1], b ? b.value : "");  setLv(r.vals[1], b ? level(b) : "");
            drawSpark(r, a);
        }
    }

    // ---------- Construcao ----------
    const openState = (() => { try { return JSON.parse(store.get("lhm-open", "{}")) || {}; } catch (_) { return {}; } })();
    const isOpen = c => (c.key in openState ? openState[c.key] : OPEN_TYPES.has(c.sensors[0].type));

    let model = null, signature = "", query = "", view = store.get("lhm-view", "panels");
    let panelRefs = new Map(), treeRefs = new Map(), catSums = new Map(), panelNodes = [], treeNodes = [];

    const sig = hws => hws.map(h => h.id + ":" + h.cats.map(c => c.key + "=" + c.sensors.map(s => s.id).join(",")).join(";")).join("|");
    const CHEV = '<svg class="i chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';

    function build() {
        panelRefs = new Map(); treeRefs = new Map(); catSums = new Map(); panelNodes = []; treeNodes = [];
        const tfrag = document.createDocumentFragment();
        let sensorCount = 0;

        for (const hw of model.hws) {
            const panel = document.createElement("section");
            panel.className = "panel";
            panel.innerHTML = `<div class="p-head"><img src="${icon(hw.img)}" alt=""><div class="p-title"><b title="${esc(hw.name)}">${esc(hw.name)}</b>${hw.parent ? `<small>${esc(hw.parent)}</small>` : ""}</div></div>`
                            + `<div class="colhead grid4"><span>Sensor</span><span></span><span>Valor</span><span>Mín</span><span>Máx</span></div>`;
            const pNode = { el: panel, hw: hw.name.toLowerCase(), cats: [] };

            const trHw = document.createElement("tr");
            trHw.className = "hw";
            trHw.innerHTML = `<td colspan="4"><div class="t-name"><img src="${icon(hw.img)}" alt="">${esc(hw.name)}</div></td>`;
            tfrag.appendChild(trHw);
            const tNode = { el: trHw, hw: hw.name.toLowerCase(), rows: [] };

            for (const c of hw.cats) {
                sensorCount += c.sensors.length;
                const det = document.createElement("details");
                det.dataset.key = c.key;
                det.open = isOpen(c);
                det.innerHTML = `<summary><span class="cat-name">${CHEV}<img src="${icon(c.img)}" alt=""><span>${esc(c.text)}</span><em>${c.sensors.length}</em></span><span class="cat-sum"></span></summary>`;
                if (SUMMARY_TYPES.has(c.sensors[0].type)) catSums.set(c.key, det.querySelector(".cat-sum"));
                const cNode = { el: det, cat: c.text.toLowerCase(), rows: [], src: c };

                const trCat = document.createElement("tr");
                trCat.className = "cat";
                trCat.innerHTML = `<td colspan="4"><div class="t-name"><img src="${icon(c.img)}" alt="">${esc(c.text)}</div></td>`;
                tfrag.appendChild(trCat);

                for (const s of c.sensors) {
                    const key = s.name.toLowerCase();
                    const row = document.createElement("div");
                    row.className = "row grid4";
                    row.innerHTML = `<span class="name" title="${esc(s.name)}">${esc(s.name)}</span>${BAR_TYPES.has(s.type) ? '<span class="meter"><i></i></span>' : "<span></span>"}<span class="v"></span><span class="mn"></span><span class="mx"></span>`;
                    det.appendChild(row);
                    const k = row.children;
                    panelRefs.set(s.id, { bar: k[1].firstElementChild, v: k[2], mn: k[3], mx: k[4], p: "" });
                    cNode.rows.push({ el: row, key });

                    const tr = document.createElement("tr");
                    tr.className = "s";
                    tr.innerHTML = `<td>${esc(s.name)}</td><td class="n v"></td><td class="n muted"></td><td class="n muted"></td>`;
                    tfrag.appendChild(tr);
                    const tc = tr.children;
                    treeRefs.set(s.id, { v: tc[1], mn: tc[2], mx: tc[3] });
                    tNode.rows.push({ el: tr, key, cat: c.text.toLowerCase(), catEl: trCat });
                }
                pNode.cats.push(cNode);
                panel.appendChild(det);
            }
            panelNodes.push(pNode);
            treeNodes.push(tNode);
        }
        $("tbody").replaceChildren(tfrag);
        setText($("counts"), `${model.hws.length} dispositivos · ${sensorCount} sensores`);
        applyFilter();
    }

    // ---------- Masonry: distribui os paineis pela coluna mais curta ----------
    // Calculado so ao construir, filtrar ou mudar o numero de colunas,
    // para os paineis nao saltarem quando se abre/fecha uma categoria.
    const MIN_COL = 400, GAP = 8;
    let colCount = 0;
    const ROW_H = 24;
    function estimate(p) {
        let h = 34 + 20;
        for (const c of p.cats) {
            if (c.el.hidden) continue;
            h += ROW_H + 1;
            if (c.el.open) h += c.rows.reduce((n, r) => n + (r.el.hidden ? 0 : ROW_H), 0);
        }
        return h;
    }
    function layoutPanels(force) {
        const host = $("panels");
        const n = Math.max(1, Math.floor((host.clientWidth + GAP) / (MIN_COL + GAP)));
        if (!force && n === colCount) return;
        colCount = n;
        const cols = Array.from({ length: n }, () => { const d = document.createElement("div"); d.className = "col"; return d; });
        const heights = new Array(n).fill(0);
        for (const p of panelNodes) {
            if (p.el.hidden) { cols[0].appendChild(p.el); continue; }
            const i = heights.indexOf(Math.min(...heights));
            cols[i].appendChild(p.el);
            heights[i] += estimate(p) + GAP;
        }
        host.replaceChildren(...cols);
    }
    new ResizeObserver(() => { if (view === "panels") layoutPanels(false); }).observe($("panels"));

    // ---------- Atualizacao dos valores (so o que mudou) ----------
    function updateValues() {
        const panels = view === "panels";
        for (const hw of model.hws) for (const c of hw.cats) {
            for (const s of c.sensors) {
                const lv = level(s);
                if (panels) {
                    const r = panelRefs.get(s.id);
                    if (!r) continue;
                    setText(r.v, s.value); setLv(r.v, lv);
                    setText(r.mn, s.min || "-"); setText(r.mx, s.max || "-");
                    if (r.bar) {
                        const p = barPct(s);
                        const ps = (p === null ? 0 : p).toFixed(1) + "%";
                        if (r.p !== ps) { r.p = ps; r.bar.style.width = ps; }
                        setLv(r.bar, lv);
                    }
                } else {
                    const r = treeRefs.get(s.id);
                    if (!r) continue;
                    setText(r.v, s.value); setLv(r.v, lv);
                    setText(r.mn, s.min || "-"); setText(r.mx, s.max || "-");
                }
            }
            const sumEl = panels && catSums.get(c.key);
            if (sumEl) { const top = maxBy(c.sensors); setText(sumEl, top ? "máx " + top.value : ""); }
        }
    }

    // ---------- Pesquisa ----------
    function applyFilter() {
        const q = query;
        let visible = 0;
        for (const p of panelNodes) {
            let hits = 0;
            const hwHit = !q || p.hw.includes(q);
            for (const c of p.cats) {
                const catHit = hwHit || c.cat.includes(q);
                let n = 0;
                for (const r of c.rows) { const show = catHit || r.key.includes(q); r.el.hidden = !show; if (show) n++; }
                c.el.hidden = n === 0;
                c.el.open = q ? n > 0 : isOpen(c.src);
                hits += n;
            }
            p.el.hidden = hits === 0;
            if (hits) visible++;
        }
        for (const t of treeNodes) {
            const hwHit = !q || t.hw.includes(q);
            let n = 0;
            const shownCats = new Set();
            for (const r of t.rows) {
                const show = hwHit || r.cat.includes(q) || r.key.includes(q);
                r.el.hidden = !show;
                if (show) { n++; shownCats.add(r.catEl); }
            }
            t.el.hidden = n === 0;
            for (const r of t.rows) r.catEl.hidden = !shownCats.has(r.catEl);
        }
        $("empty").hidden = !(model && !visible);
        if (view === "panels") layoutPanels(true);
    }

    // Guarda abertura/fecho feito pelo utilizador (nao durante a pesquisa).
    $("panels").addEventListener("toggle", e => {
        const d = e.target;
        if (!(d instanceof HTMLDetailsElement) || query) return;
        openState[d.dataset.key] = d.open;
        store.set("lhm-open", JSON.stringify(openState));
    }, true);

    // ---------- Ciclo de dados ----------
    let timer = 0, fetching = false, intervalMs = parseInt(store.get("lhm-interval", "1500"), 10);
    if (![0, 1000, 1500, 3000, 5000].includes(intervalMs)) intervalMs = 1500;
    let lastOk = "";

    function setStatus(kind, text) {
        $("dot").className = "dot" + (kind ? " " + kind : "");
        setText($("statusText"), text);
    }

    async function refresh() {
        if (fetching) return;
        fetching = true;
        try {
            const res = await fetch("data.json", { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            model = parse(await res.json());
            const s = sig(model.hws);
            if (s !== signature) { signature = s; build(); }
            setText($("host"), model.host);
            updateTiles(model.hws);
            updateValues();
            lastOk = new Date().toLocaleTimeString("pt-PT");
            setStatus(intervalMs ? "" : "paused", (intervalMs ? "Em direto" : "Pausado") + " · atualizado às " + lastOk);
        } catch (err) {
            setStatus("error", "Sem ligação" + (lastOk ? " · último dado às " + lastOk : ""));
            console.error("Falha ao carregar data.json:", err);
        } finally {
            fetching = false;
        }
    }

    function schedule() {
        clearTimeout(timer);
        if (!intervalMs) { setStatus("paused", "Pausado" + (lastOk ? " · atualizado às " + lastOk : "")); return; }
        timer = setTimeout(async () => {
            if (!document.hidden) await refresh();
            schedule();
        }, intervalMs);
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); schedule(); } });

    // ---------- Controlos ----------
    function setView(v) {
        view = v;
        store.set("lhm-view", v);
        $("viewPanels").setAttribute("aria-pressed", v === "panels");
        $("viewTree").setAttribute("aria-pressed", v === "tree");
        $("panels").hidden = v !== "panels";
        $("tree").hidden = v !== "tree";
        if (v === "panels") layoutPanels(true);
        if (model) updateValues();
    }
    $("viewPanels").onclick = () => setView("panels");
    $("viewTree").onclick = () => setView("tree");

    $("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); applyFilter(); });

    $("interval").value = String(intervalMs);
    $("interval").addEventListener("change", e => {
        intervalMs = parseInt(e.target.value, 10);
        store.set("lhm-interval", String(intervalMs));
        schedule();
        if (intervalMs) refresh();
    });

    $("reset").addEventListener("click", async () => {
        try { await fetch("ResetAllMinMax"); await refresh(); }
        catch (err) { console.error("Falha ao repor mín/máx:", err); }
    });

    // Tema: os tres temas da app. Sem escolha guardada segue o sistema (claro/escuro).
    const THEMES = ["light", "dark", "black"];
    const dark = matchMedia("(prefers-color-scheme: dark)");
    const effective = () => {
        const saved = store.get("color-scheme", "");
        return THEMES.includes(saved) ? saved : (dark.matches ? "dark" : "light");
    };
    function paintThemeIcon() {
        const cur = effective();
        for (const b of $("themes").children) b.setAttribute("aria-pressed", b.dataset.theme === cur);
    }
    $("themes").addEventListener("click", e => {
        const b = e.target.closest("button[data-theme]");
        if (!b) return;
        const t = b.dataset.theme;
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t === "light" ? "light" : "dark";
        store.set("color-scheme", t);
        paintThemeIcon();
    });
    dark.addEventListener("change", paintThemeIcon);

    // ---------- Arranque ----------
    initTiles();
    paintThemeIcon();
    setView(view === "tree" ? "tree" : "panels");
    refresh().then(schedule);
})();
</script>
</body>
</html>
